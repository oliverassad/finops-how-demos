apiVersion: v1
kind: Namespace
metadata:
  name: checkout
  labels: {team: checkout, env: lab, cost-center: cc-1200}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: checkout
  labels: {team: checkout, app: checkout, env: lab, cost-center: cc-1200}
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {team: checkout, app: checkout, env: lab, cost-center: cc-1200}
    spec:
      containers:
        - name: load
          image: busybox:1.37.0
          # Duty cycle: one busy core for 9s, then sleep 1s. Average use = 9/10 core, about half the request.
          command: ["sh", "-c", "while true; do timeout 9 sh -c 'while :; do :; done'; sleep 1; done"]
          resources:
            requests: {cpu: 1800m, memory: 256Mi}
            limits: {cpu: 1800m, memory: 256Mi}
