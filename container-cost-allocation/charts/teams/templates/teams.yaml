metadata:
  name: platform
  namespace: platform
  labels: {team: platform, app: platform, env: lab, cost-center: cc-1200}
spec:
  replicas: 1
  selector:
    matchLabels: {app: platform}
  template:
    metadata:
      labels: {team: platform, app: platform, env: lab, cost-center: cc-1200}
    spec:
      containers:
        - name: load
          image: busybox:1.37.0
          # Duty cycle: one busy core for 5s, then sleep 5s. Average use = 0.6 core (limit) x 5/10 = 0.3 core, about half the request.
          command: ["sh", "-c", "while true; do timeout 5 sh -c 'while :; do :; done'; sleep 5; done"]
          resources:
            requests: {cpu: 600m, memory: 128Mi}
            limits: {cpu: 600m, memory: 128Mi}
